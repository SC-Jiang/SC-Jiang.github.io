name: Hugo Preview Build

on:
  push:
    branches:
      - SC-Jiang-Homepage-V2
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install TailwindCSS CLI
        run: npm install -g tailwindcss @tailwindcss/cli

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build with Hugo
        run: hugo --minify --baseURL "https://sc-jiang.github.io/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hugo-preview-site
          path: ./public
