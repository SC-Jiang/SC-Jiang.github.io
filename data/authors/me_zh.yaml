bio: |
  我是东北大学信息科学与工程学院博士研究生，并曾赴新加坡国立大学运筹与分析研究所联合培养。我的研究兴趣包括数据驱动优化、分布式鲁棒优化、随机建模与供应链分析。我关注如何在分布信息有限、需求不确定和运营环境复杂的条件下，构建可求解、可解释且具有管理启示的优化模型与算法。

  以上中文内容为占位文本，你可以后续根据需要自行替换。

