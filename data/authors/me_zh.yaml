bio: |
  我即将加入西安交通大学管理学院。我于中国东北大学信息科学与工程学院数据智能与系统工程研究所获得博士学位，师从[黄敏教授](http://www.ise.neu.edu.cn/2019/0109/c5989a8236/page.htm)。博士期间，我以访问博士生身份赴新加坡国立大学运筹与分析研究所开展学术研究，合作导师为[张俊标教授](https://iora.nus.edu.sg/people-p/teo-chung-piaw/)。我的研究方向包括数据驱动优化、分布鲁棒优化与随机建模，及其在供应链管理领域的应用，例如库存优化、供应链网络设计和物流规划等。  

