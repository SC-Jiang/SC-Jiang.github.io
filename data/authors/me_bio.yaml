bio: |
  I am an Assistant Professor at the School of Management, Xi’an Jiaotong University. I have been selected for Xi’an Jiaotong University’s Program for Supporting Young and Excellent Talents. Previously, I received my Ph.D. degree from the College of Information Science and Engineering at Northeastern University, China, under the supervision of Prof. [Min Huang](http://www.ise.neu.edu.cn/2019/0109/c5989a8236/page.htm). During my doctoral studies, I was also a visiting Ph.D. student at the Institute of Operations Research and Analytics, National University of Singapore, supervised by Prof. [Chung-Piaw Teo](https://iora.nus.edu.sg/people-p/teo-chung-piaw/). My research focuses on data-driven optimization, distributionally robust optimization, and stochastic modeling, with applications in supply chain management, such as inventory optimization, supply chain network design, logistics planning.   

